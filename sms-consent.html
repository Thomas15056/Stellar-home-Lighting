
<script>
document.addEventListener('DOMContentLoaded', function () {
  const form = document.getElementById('smsForm');
  const status = document.getElementById('status');
  const btn = document.getElementById('submit');

  form.addEventListener('submit', async function (event) {
    event.preventDefault();

    if (!form.reportValidity()) return;

    const transactional =
      document.getElementById('transactional').checked;

    const marketing =
      document.getElementById('marketing').checked;

    // Both SMS checkboxes are optional.
    // Neither checkbox needs to be selected.

    const data = new FormData(form);

    const payload = {
      first_name: String(data.get('first_name') || '').trim(),
      last_name: String(data.get('last_name') || '').trim(),
      phone: String(data.get('phone') || '').trim(),
      email: String(data.get('email') || '').trim(),

      sms_transactional: transactional,
      sms_marketing: marketing,

      lead_source: 'Stellar Home Lighting SMS Consent Page',
      service: 'Permanent Outdoor Lighting',
      page_url: window.location.href,
      submitted_at: new Date().toISOString(),
      consent_text_version: '2026-11-02'
    };

    btn.disabled = true;
    status.textContent = 'Saving your preferences...';

    try {
      const response = await fetch('/api/lead', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });

      const result = await response.json().catch(() => ({}));

      if (!response.ok || result.ok === false) {
        throw new Error('Server rejected submission');
      }

      if (!transactional && !marketing) {
        status.textContent =
          'Your preferences have been submitted. You have not opted in to receive SMS messages.';
      } else {
        status.textContent =
          'Thank you! Your selected SMS preferences have been submitted successfully.';
      }

      form.reset();

    } catch (error) {
      console.error('SMS submission error:', error);

      status.textContent =
        'Unable to save your preferences. Please call (850) 296-7028 for assistance.';
    } finally {
      btn.disabled = false;
    }
  });
});
</script>
